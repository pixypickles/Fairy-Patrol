<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#dff3d2" />
  <title>Fairy Guardian v3.0.0</title>
  <style>
:root {
  color-scheme: light;
  font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: #edf6e8;
  color: #203327;
  touch-action: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow: hidden; }
body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.9), transparent 26%),
    linear-gradient(#edf8e8, #d9ecd2);
}
button { font: inherit; -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: min(100vw, 590px);
  height: 100svh;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
}

.game-frame {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border-radius: 24px;
  background: #7dab5f;
  box-shadow: 0 12px 40px rgba(39,74,40,.2);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #7aaa5c;
}

.screen-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: linear-gradient(rgba(239,251,232,.58), rgba(224,244,215,.78));
  backdrop-filter: blur(3px);
}

.title-card {
  width: min(100%, 390px);
  padding: 28px 24px;
  text-align: center;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 28px;
  background: rgba(255,255,255,.82);
  box-shadow: 0 18px 45px rgba(46,78,47,.2);
}
.eyebrow { margin: 0 0 8px; color: #588c65; font-weight: 800; letter-spacing: .08em; }
h1 { margin: 0 0 14px; font-size: clamp(28px, 8vw, 42px); line-height: 1.2; }
.title-card p { line-height: 1.7; }
.primary-button {
  border: 0;
  border-radius: 999px;
  padding: 14px 26px;
  color: white;
  font-weight: 900;
  background: linear-gradient(#70bd7a, #4c9d60);
  box-shadow: 0 7px 0 #347943, 0 10px 25px rgba(43,105,55,.25);
}
.primary-button:active { transform: translateY(4px); box-shadow: 0 3px 0 #347943; }

.hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  pointer-events: none;
}
.hud > div {
  min-width: 0;
  padding: 7px 11px;
  border: 2px solid rgba(30,50,35,.72);
  border-radius: 14px;
  background: rgba(255,255,255,.82);
  box-shadow: 0 3px 0 rgba(30,50,35,.18);
}
.hud-label { margin-right: 5px; font-size: 12px; font-weight: 900; color: #56705d; }
.hud-label.plus { color: #27865b; }
.hud-label.minus { color: #b64f5d; }
.hidden { display: none !important; }

.controls {
  display: grid;
  grid-template-columns: 152px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(77,110,71,.2);
  border-radius: 22px;
  background: rgba(255,255,255,.76);
  box-shadow: 0 8px 24px rgba(52,83,52,.12);
}

.stick {
  position: relative;
  width: 138px;
  aspect-ratio: 1;
  border-radius: 50%;
  touch-action: none;
  user-select: none;
}
.stick-ring {
  position: absolute;
  inset: 9px;
  border: 4px solid rgba(51,76,56,.72);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.9), rgba(203,225,199,.82));
  box-shadow: inset 0 4px 12px rgba(57,86,57,.14);
}
.stick-knob {
  position: absolute;
  width: 60px;
  height: 60px;
  left: 39px;
  top: 39px;
  border: 3px solid #304c37;
  border-radius: 50%;
  background: linear-gradient(#fff, #cfe4ca);
  box-shadow: 0 5px 12px rgba(43,70,48,.25);
  transform: translate(0,0);
}

.action-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.action-button {
  min-height: 62px;
  border: 3px solid #2c4733;
  border-radius: 18px;
  color: #233629;
  font-size: 13px;
  font-weight: 900;
  box-shadow: 0 5px 0 rgba(42,65,47,.25);
}
.action-button .symbol { display: block; font-size: 21px; line-height: 1; margin-bottom: 3px; }
.action-button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(42,65,47,.25); }
.action-button.wind { background: linear-gradient(135deg, #f8fff2, #aee7af); }
.action-button.water { background: linear-gradient(135deg, #effcff, #75c8ff); }
.action-button.chick { background: linear-gradient(135deg, #fffceb, #ffe17b); }

@media (max-height: 700px) {
  .app-shell { gap: 4px; }
  .controls { grid-template-columns: 120px 1fr; padding: 6px 8px; }
  .stick { width: 112px; }
  .stick-knob { width: 48px; height: 48px; left: 32px; top: 32px; }
  .action-button { min-height: 50px; }
}

</style>
</head>
<body>
  <main class="app-shell">
    <section class="game-frame" aria-label="Fairy Guardian game">
      <canvas id="gameCanvas" width="540" height="960"></canvas>

      <div id="titleScreen" class="screen-overlay">
        <div class="title-card">
          <p class="eyebrow">Fairy Guardian</p>
          <h1>妖精とヒヨコの<br>森のおさんぽ</h1>
          <p>風と水の力で、ヒヨコをそっと見守ろう。</p>
          <button id="startButton" class="primary-button" type="button">おさんぽを始める</button>
        </div>
      </div>

      <div id="hud" class="hud hidden" aria-live="polite">
        <div><span class="hud-label">距離</span><strong id="distanceText">0 m</strong></div>
        <div><span class="hud-label plus">＋</span><strong id="plusScore">0</strong></div>
        <div><span class="hud-label minus">－</span><strong id="minusScore">0</strong></div>
      </div>
    </section>

    <section id="controls" class="controls hidden" aria-label="操作パネル">
      <div id="stick" class="stick" aria-label="8方向移動スティック">
        <div class="stick-ring"></div>
        <div id="stickKnob" class="stick-knob"></div>
      </div>

      <div class="action-grid">
        <button id="windButton" class="action-button wind" type="button">
          <span class="symbol">○</span><span>風・上</span>
        </button>
        <button id="waterButton" class="action-button water" type="button">
          <span class="symbol">●</span><span>水・上</span>
        </button>
        <button id="chickLeftButton" class="action-button chick" type="button">
          <span class="symbol">🐥←</span><span>ヒヨコ左</span>
        </button>
        <button id="chickRightButton" class="action-button chick" type="button">
          <span class="symbol">🐥→</span><span>ヒヨコ右</span>
        </button>
      </div>
    </section>
  </main>

  <script>
class InputController {
  constructor(stick, knob) {
    this.stick = stick;
    this.knob = knob;
    this.vector = { x: 0, y: 0 };
    this.pointerId = null;
    this.maxRadius = 42;
    this.keys = new Set();
    this.bind();
  }

  bind() {
    this.stick.addEventListener('pointerdown', (e) => {
      this.pointerId = e.pointerId;
      this.stick.setPointerCapture(e.pointerId);
      this.updatePointer(e);
    });
    this.stick.addEventListener('pointermove', (e) => {
      if (e.pointerId === this.pointerId) this.updatePointer(e);
    });
    const end = (e) => {
      if (e.pointerId !== this.pointerId) return;
      this.pointerId = null;
      this.vector.x = 0;
      this.vector.y = 0;
      this.knob.style.transform = 'translate(0px, 0px)';
    };
    this.stick.addEventListener('pointerup', end);
    this.stick.addEventListener('pointercancel', end);

    window.addEventListener('keydown', (e) => this.keys.add(e.key));
    window.addEventListener('keyup', (e) => this.keys.delete(e.key));
  }

  updatePointer(e) {
    const rect = this.stick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const length = Math.hypot(dx, dy);
    const max = rect.width * 0.31;
    if (length > max) {
      dx = dx / length * max;
      dy = dy / length * max;
    }
    const nx = dx / max;
    const ny = dy / max;
    const dead = 0.18;
    if (Math.hypot(nx, ny) < dead) {
      this.vector.x = 0;
      this.vector.y = 0;
    } else {
      const angle = Math.atan2(ny, nx);
      const step = Math.PI / 4;
      const snapped = Math.round(angle / step) * step;
      this.vector.x = Math.cos(snapped);
      this.vector.y = Math.sin(snapped);
    }
    this.knob.style.transform = `translate(${dx}px, ${dy}px)`;
  }

  getVector() {
    let x = this.vector.x;
    let y = this.vector.y;
    if (this.keys.has('ArrowLeft') || this.keys.has('a')) x -= 1;
    if (this.keys.has('ArrowRight') || this.keys.has('d')) x += 1;
    if (this.keys.has('ArrowUp') || this.keys.has('w')) y -= 1;
    if (this.keys.has('ArrowDown') || this.keys.has('s')) y += 1;
    const length = Math.hypot(x, y);
    return length > 1 ? { x: x / length, y: y / length } : { x, y };
  }
}

class Stage {
  constructor(width, height) {
    this.width = width;
    this.height = height;
    this.offset = 0;
    this.speed = 44;
    this.patches = this.createPatches();
  }

  createPatches() {
    const patches = [];
    let seed = 1337;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    for (let i = 0; i < 110; i++) {
      patches.push({
        x: rnd() * this.width,
        y: rnd() * (this.height + 220),
        r: 10 + rnd() * 34,
        type: rnd(),
        phase: rnd() * Math.PI * 2
      });
    }
    return patches;
  }

  update(dt) { this.offset = (this.offset + this.speed * dt) % (this.height + 220); }

  draw(ctx, time) {
    ctx.fillStyle = '#7ca85d';
    ctx.fillRect(0, 0, this.width, this.height);

    const bg = ctx.createLinearGradient(0, 0, this.width, this.height);
    bg.addColorStop(0, 'rgba(190,215,130,.18)');
    bg.addColorStop(.5, 'rgba(42,108,52,.06)');
    bg.addColorStop(1, 'rgba(230,220,135,.11)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, this.width, this.height);

    for (const p of this.patches) {
      let y = (p.y + this.offset) % (this.height + 220) - 110;
      if (p.type < .42) {
        ctx.fillStyle = p.type < .2 ? 'rgba(91,137,67,.24)' : 'rgba(190,180,96,.15)';
        ctx.beginPath(); ctx.ellipse(p.x, y, p.r * 1.4, p.r, p.phase, 0, Math.PI*2); ctx.fill();
      } else if (p.type < .76) {
        ctx.strokeStyle = 'rgba(39,104,47,.43)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(p.x, y + 4); ctx.quadraticCurveTo(p.x - 4, y - 5, p.x - 2, y - 10);
        ctx.moveTo(p.x + 2, y + 4); ctx.quadraticCurveTo(p.x + 7, y - 3, p.x + 6, y - 9);
        ctx.stroke();
      } else if (p.type < .9) {
        ctx.fillStyle = 'rgba(110,105,82,.42)';
        ctx.beginPath(); ctx.ellipse(p.x, y, 3 + p.r*.08, 2 + p.r*.05, p.phase, 0, Math.PI*2); ctx.fill();
      } else {
        const sway = Math.sin(time * 2 + p.phase) * 1.5;
        ctx.fillStyle = '#f6df75';
        ctx.beginPath(); ctx.arc(p.x + sway, y, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.arc(p.x - 3 + sway, y, 2.2, 0, Math.PI*2); ctx.arc(p.x + 3 + sway, y, 2.2, 0, Math.PI*2); ctx.fill();
      }
    }
  }
}

class Fairy {
  constructor(width, height) {
    this.x = width * 0.5;
    this.y = height * 0.62;
    this.speed = 300;
    this.radius = 24;
  }

  update(dt, input, width, height) {
    this.x += input.x * this.speed * dt;
    this.y += input.y * this.speed * dt;
    this.x = Math.max(34, Math.min(width - 34, this.x));
    this.y = Math.max(95, Math.min(height - 52, this.y));
  }

  draw(ctx, time) {
    const flap = Math.sin(time * 9) * 0.12;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Four translucent rainbow wings.
    const wing = (side, upper) => {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate((upper ? -0.42 : 0.42) + flap * side * (upper ? 1 : -1));
      const g = ctx.createLinearGradient(0, -28, 55, 28);
      g.addColorStop(0, 'rgba(255,120,160,.42)');
      g.addColorStop(.18, 'rgba(255,190,90,.38)');
      g.addColorStop(.36, 'rgba(255,245,120,.35)');
      g.addColorStop(.54, 'rgba(100,220,150,.34)');
      g.addColorStop(.72, 'rgba(100,190,255,.36)');
      g.addColorStop(.86, 'rgba(150,125,255,.34)');
      g.addColorStop(1, 'rgba(230,130,245,.34)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(5, 0);
      ctx.bezierCurveTo(20, upper ? -33 : 33, 53, upper ? -34 : 34, 50, 0);
      ctx.bezierCurveTo(45, upper ? 20 : -20, 21, upper ? 24 : -24, 5, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.62)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(126,114,210,.25)';
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.quadraticCurveTo(28, upper ? -10 : 10, 45, upper ? -2 : 2);
      ctx.moveTo(14, upper ? -5 : 5);
      ctx.quadraticCurveTo(26, upper ? -20 : 20, 39, upper ? -22 : 22);
      ctx.stroke();
      ctx.restore();
    };
    wing(-1, true); wing(1, true); wing(-1, false); wing(1, false);

    // Human-shaped fairy.
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2c2730';
    ctx.lineWidth = 4;
    ctx.fillStyle = '#ffd8bd';
    ctx.beginPath(); ctx.arc(0, -22, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e6b85d';
    ctx.beginPath();
    ctx.arc(-2, -25, 13, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(13, -20, 9, -9);
    ctx.quadraticCurveTo(3, -15, -9, -10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4b362e';
    ctx.beginPath(); ctx.arc(-4, -21, 1.4, 0, Math.PI*2); ctx.arc(4, -21, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2c2730';
    ctx.beginPath(); ctx.moveTo(-1, -18); ctx.quadraticCurveTo(0, -16, 2, -18); ctx.stroke();

    ctx.fillStyle = '#f2a9cf';
    ctx.beginPath();
    ctx.moveTo(-9, -8); ctx.lineTo(9, -8); ctx.lineTo(15, 19); ctx.lineTo(-15, 19); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#2c2730';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-19, 9); ctx.moveTo(8, 0); ctx.lineTo(19, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 19); ctx.lineTo(-8, 32); ctx.moveTo(6, 19); ctx.lineTo(8, 32); ctx.stroke();

    for (let i = 0; i < 4; i++) {
      const a = time * 2 + i * Math.PI / 2;
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.25 * Math.sin(time * 5 + i)})`;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 30, Math.sin(a) * 24, 2.2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

class Chick {
  constructor(width, height) {
    this.lanes = [width * 0.25, width * 0.5, width * 0.75];
    this.lane = 1;
    this.targetX = this.lanes[this.lane];
    this.x = this.targetX;
    this.y = height * 0.82;
    this.wander = 0;
  }

  guide(direction) {
    this.lane = Math.max(0, Math.min(2, this.lane + direction));
    this.targetX = this.lanes[this.lane];
  }

  update(dt, time) {
    const desire = this.targetX + Math.sin(time * 1.7) * 8 + Math.sin(time * 0.63) * 5;
    this.x += (desire - this.x) * Math.min(1, dt * 1.6);
    this.y += Math.sin(time * 3.1) * 2.5 * dt;
  }

  draw(ctx, time) {
    const bob = Math.abs(Math.sin(time * 5)) * 3;
    const step = Math.sin(time * 8) * 3;
    ctx.save();
    ctx.translate(this.x, this.y - bob);
    ctx.strokeStyle = '#2d2b21';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.ellipse(0, 5, 17, 20, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -12, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2d2b21';
    ctx.beginPath(); ctx.arc(-4, -14, 1.7, 0, Math.PI*2); ctx.arc(4, -14, 1.7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f1a438';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(-5, -5); ctx.lineTo(5, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#d98b22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-6, 23); ctx.lineTo(-8 + step, 28); ctx.moveTo(6, 23); ctx.lineTo(8 - step, 28); ctx.stroke();
    ctx.restore();
  }
}


class Game {
  constructor(canvas, input, hud) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.input = input;
    this.hud = hud;
    this.width = canvas.width;
    this.height = canvas.height;
    this.running = false;
    this.lastTime = 0;
    this.elapsed = 0;
    this.distance = 0;
    this.plus = 0;
    this.minus = 0;
    this.effects = [];
    this.stage = new Stage(this.width, this.height);
    this.fairy = new Fairy(this.width, this.height);
    this.chick = new Chick(this.width, this.height);
    this.loop = this.loop.bind(this);
  }

  start() {
    this.running = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.loop);
  }

  guideChick(direction) { this.chick.guide(direction); }

  cast(kind) {
    if (!this.running) return;
    const isWater = kind === 'water';
    this.effects.push({
      x: this.fairy.x,
      y: this.fairy.y - 16,
      age: 0,
      life: .65,
      kind: isWater ? 'water' : 'wind'
    });
  }

  update(dt) {
    this.elapsed += dt;
    this.distance += dt * 5;
    this.stage.update(dt);
    this.fairy.update(dt, this.input.getVector(), this.width, this.height);
    this.chick.update(dt, this.elapsed);
    for (const e of this.effects) {
      e.age += dt;
      e.y -= dt * 220;
    }
    this.effects = this.effects.filter(e => e.age < e.life);
    this.hud.distance.textContent = `${Math.floor(this.distance)} m`;
    this.hud.plus.textContent = this.plus;
    this.hud.minus.textContent = this.minus;
  }

  drawEffect(e) {
    const ctx = this.ctx;
    const t = e.age / e.life;
    ctx.save();
    ctx.globalAlpha = 1 - t * .7;
    ctx.translate(e.x, e.y);
    if (e.kind === 'wind') {
      const r = 17 + t * 8;
      const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(.45, 'rgba(197,255,210,.75)');
      g.addColorStop(1, 'rgba(115,226,160,.08)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(235,255,238,.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * .72, 0, Math.PI*2); ctx.stroke();
    } else {
      const r = 16 + t * 5;
      const g = ctx.createRadialGradient(-6, -7, 2, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(.25, 'rgba(89,196,255,.98)');
      g.addColorStop(.72, 'rgba(0,116,235,.88)');
      g.addColorStop(1, 'rgba(0,73,180,.35)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.78)';
      ctx.beginPath(); ctx.ellipse(-6, -7, 5, 3, -.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  draw() {
    this.stage.draw(this.ctx, this.elapsed);
    this.chick.draw(this.ctx, this.elapsed);
    for (const e of this.effects) this.drawEffect(e);
    this.fairy.draw(this.ctx, this.elapsed);
  }

  loop(now) {
    if (!this.running) return;
    const dt = Math.min(.033, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.update(dt);
    this.draw();
    requestAnimationFrame(this.loop);
  }
}


const canvas = document.querySelector('#gameCanvas');
const titleScreen = document.querySelector('#titleScreen');
const startButton = document.querySelector('#startButton');
const controls = document.querySelector('#controls');
const hudElement = document.querySelector('#hud');

const input = new InputController(
  document.querySelector('#stick'),
  document.querySelector('#stickKnob')
);

const game = new Game(canvas, input, {
  distance: document.querySelector('#distanceText'),
  plus: document.querySelector('#plusScore'),
  minus: document.querySelector('#minusScore')
});

startButton.addEventListener('click', () => {
  titleScreen.classList.add('hidden');
  controls.classList.remove('hidden');
  hudElement.classList.remove('hidden');
  game.start();
});

document.querySelector('#windButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.cast('wind');
});
document.querySelector('#waterButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.cast('water');
});
document.querySelector('#chickLeftButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(-1);
});
document.querySelector('#chickRightButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(1);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'j') game.cast('wind');
  if (e.key === 'k') game.cast('water');
  if (e.key === 'q') game.guideChick(-1);
  if (e.key === 'e') game.guideChick(1);
});
</script>
</body>
</html>
