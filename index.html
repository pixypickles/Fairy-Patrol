    ctx.rotate(Math.sin(e.age * 18) * .025);
    ctx.globalCompositeOperation = 'lighter';

    const layers = 5;
    for (let i = 0; i < layers; i++) {
      const y = 12 - i * 7;
      const width = 7 + i * 4.1;
      const spin = e.age * 22 + i * 1.18;
      const squash = .82 + Math.sin(spin) * .08;
      ctx.strokeStyle = `rgba(${185 + i * 10},255,${205 + i * 8},${.48 + i * .07})`;
      ctx.lineWidth = 4.5 - i * .45;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(Math.sin(spin) * 1.35, y, width, (3.7 + i * .42) * squash, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    const glow = ctx.createRadialGradient(0, -4, 1, 0, -4, 27);
    glow.addColorStop(0, 'rgba(245,255,246,.72)');
    glow.addColorStop(.45, 'rgba(143,244,171,.22)');
    glow.addColorStop(1, 'rgba(74,216,130,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.ellipse(0, -2, 25, 31, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = e.age * 8 + i * Math.PI / 2;
      ctx.fillStyle = 'rgba(220,255,228,.7)';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (17 + i), -3 + Math.sin(a) * 10, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawWaterTravel(ctx, e) {
    const r = e.spreadShot ? 12.5 : 18;
    const g = ctx.createRadialGradient(-6, -7, 2, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.22, 'rgba(95,205,255,.98)');
    g.addColorStop(.68, 'rgba(0,123,239,.94)');
    g.addColorStop(1, 'rgba(0,63,170,.62)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.beginPath(); ctx.ellipse(-6, -7, 5, 3, -.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(71,183,255,.65)';
    ctx.beginPath(); ctx.arc(10, 9, 3, 0, Math.PI * 2); ctx.fill();
  }

  drawBurst(ctx, e) {
    const t = e.age / e.burst;
    ctx.globalAlpha = Math.max(0, 1 - t);
    if (e.kind === 'wind') {
      const r = 20 + t * 72 * (e.power || 1);
      ctx.strokeStyle = `rgba(207,255,220,${0.9 - t * 0.6})`;
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.lineCap = 'round';
      // The mini tornado loosens into two curved gusts instead of exploding.
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        const startA = arm * Math.PI + e.age * 3;
        for (let j = 0; j <= 18; j++) {
          const q = j / 18;
          const rr = r * (.28 + q * .72);
          const a = startA + q * Math.PI * 1.35;
          const px = Math.cos(a) * rr;
          const py = Math.sin(a) * rr * .72;
          if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.strokeStyle = `rgba(255,255,255,${0.62 - t * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, r * .72, r * .42, e.age * 2, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 7; i++) {
        const a = i * Math.PI * 2 / 7 + e.age * 2;
        const d = 14 + t * 58;
        ctx.fillStyle = `rgba(187,247,202,${0.7 - t * 0.55})`;
        ctx.beginPath(); ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, 5, 2, a, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      const r = 11 + t * 42 * (e.power || 1);
      ctx.strokeStyle = `rgba(43,157,255,${0.88 - t * 0.65})`;
      ctx.lineWidth = 7 * (1 - t) + 1;
      ctx.beginPath(); ctx.ellipse(0, 5, r, r * 0.48, 0, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI * 2 / 10;
        const d = 9 + t * 39;
        const drop = 2.8 + (i % 3) * 1.2;
        ctx.fillStyle = `rgba(${i % 2 ? '64,177,255' : '129,218,255'},${0.9 - t * 0.7})`;
        ctx.beginPath(); ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d * 0.58, drop, drop * 1.5, a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = `rgba(220,247,255,${0.65 - t * 0.5})`;
      ctx.beginPath(); ctx.ellipse(0, 5, r * .65, r * .23, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawEffect(e) {
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.phase === 'travel') {
      if (e.kind === 'wind') this.drawWindTravel(ctx, e);
      else {
        const h = e.airHeight || 0;
        // Ground shadow makes the short arc readable from the top-down camera.
        ctx.save();
        ctx.globalAlpha = .18 + Math.max(0, 1 - h / 28) * .12;
        ctx.fillStyle = '#174f78';
        ctx.beginPath();
        ctx.ellipse(0, 5, e.spreadShot ? 8 : 12, e.spreadShot ? 3 : 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.translate(0, -h);
        this.drawWaterTravel(ctx, e);
      }
    } else {
      this.drawBurst(ctx, e);
    }
    ctx.restore();
  }

  draw() {
    this.stage.draw(this.ctx, this.elapsed);
    for (const river of this.rivers) river.draw(this.ctx, this.elapsed);
    for (const ledge of this.ledges) ledge.draw(this.ctx, this.elapsed);
    for (const pile of this.leafPiles) pile.draw(this.ctx, this.elapsed);
    for (const flower of this.flowers) flower.draw(this.ctx, this.elapsed);
    for (const d of this.dandelions) d.draw(this.ctx, this.elapsed);
    this.chick.draw(this.ctx, this.elapsed);
    for (const cat of this.cats) cat.draw(this.ctx, this.elapsed);
    for (const bird of this.birds) bird.draw(this.ctx, this.elapsed);
    for (const e of this.effects) this.drawEffect(e);
    this.fairy.draw(this.ctx, this.elapsed, this.chick);
  }

  loop(now) {
    if (!this.running) return;
    const dt = Math.min(.033, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.update(dt);
    this.draw();
    requestAnimationFrame(this.loop);
  }
}




const canvas = document.querySelector('#gameCanvas');
const titleScreen = document.querySelector('#titleScreen');
const startButton = document.querySelector('#startButton');
const controls = document.querySelector('#controls');
const hudElement = document.querySelector('#hud');

const input = new InputController(
  document.querySelector('#stick'),
  document.querySelector('#stickKnob')
);

const game = new Game(canvas, input, {
  distance: document.querySelector('#distanceText'),
  plus: document.querySelector('#plusScore'),
  minus: document.querySelector('#minusScore')
});

startButton.addEventListener('click', () => {
  titleScreen.classList.add('hidden');
  controls.classList.remove('hidden');
  hudElement.classList.remove('hidden');
  game.start();
});

const windButton = document.querySelector('#windButton');
let windChargeStarted = 0;
let windChargeFrame = 0;

function updateWindChargeMeter() {
  if (!windChargeStarted) return;
  const ratio = Math.min(1, (performance.now() - windChargeStarted) / 900);
  windButton.style.setProperty('--charge', ratio.toFixed(3));
  windChargeFrame = requestAnimationFrame(updateWindChargeMeter);
}

function releaseWind(e) {
  if (!windChargeStarted) return;
  e?.preventDefault();
  const seconds = Math.min(0.9, (performance.now() - windChargeStarted) / 1000);
  windChargeStarted = 0;
  cancelAnimationFrame(windChargeFrame);
  windButton.classList.remove('charging');
  windButton.style.setProperty('--charge', '0');
  game.cast('wind', seconds);
}

windButton.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (windChargeStarted) return;
  windChargeStarted = performance.now();
  windButton.classList.add('charging');
  windButton.setPointerCapture?.(e.pointerId);
  updateWindChargeMeter();
});
windButton.addEventListener('pointerup', releaseWind);
windButton.addEventListener('pointercancel', releaseWind);
const waterButton = document.querySelector('#waterButton');
let waterChargeStarted = 0;
let waterChargeFrame = 0;

function updateWaterChargeMeter() {
  if (!waterChargeStarted) return;
  const ratio = Math.min(1, (performance.now() - waterChargeStarted) / 900);
  waterButton.style.setProperty('--charge', ratio.toFixed(3));
  waterChargeFrame = requestAnimationFrame(updateWaterChargeMeter);
}

function releaseWater(e) {
  if (!waterChargeStarted) return;
  e?.preventDefault();
  const seconds = Math.min(.9, (performance.now() - waterChargeStarted) / 1000);
  waterChargeStarted = 0;
  cancelAnimationFrame(waterChargeFrame);
  waterButton.classList.remove('charging');
  waterButton.style.setProperty('--charge', '0');
  game.cast('water', seconds);
}

waterButton.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (waterChargeStarted) return;
  waterChargeStarted = performance.now();
  waterButton.classList.add('charging');
  waterButton.setPointerCapture?.(e.pointerId);
  updateWaterChargeMeter();
});
waterButton.addEventListener('pointerup', releaseWater);
waterButton.addEventListener('pointercancel', releaseWater);
document.querySelector('#chickLeftButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(-1);
});
document.querySelector('#chickRightButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(1);
});

// Prevent mobile long-press selection/callout menus on the game UI.
document.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });
document.addEventListener('selectstart', (e) => e.preventDefault(), { passive: false });
document.addEventListener('dragstart', (e) => e.preventDefault(), { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'j' && !e.repeat) game.cast('wind', 0.35);
  if (e.key === 'k' && !e.repeat) game.cast('water', .5);
  if (e.key === 'q') game.guideChick(-1);
  if (e.key === 'e') game.guideChick(1);
});

</script>
