    this.sideBranches = [];
    this.sideBranchSpawnTimer = 8.0;
    this.rocks = [];
    this.rockSpawnTimer = 13.0;
    this.butterflies = [];
    this.butterflySpawnTimer = 2.5;
    this.ladybugs = [];
    this.ladybugSpawnTimer = 5.0;
    this.frogs = [];
    this.frogCooldown = 0;
    this.flowerAdmireCooldown = 4.0;
    this.mushroomNoteTimer = 0;
    this.mushroomNoteStreak = 0;
    this.lastMushroomNote = -1;
    this.caveCelebration = 0;
    this.completedMushroomGroups = new Set();
    this.leftHintButton = document.querySelector('#chickLeftButton');
    this.rightHintButton = document.querySelector('#chickRightButton');
    this.stage = new Stage(this.width, this.height);
    this.fairy = new Fairy(this.width, this.height);
    this.chick = new Chick(this.width, this.height);
    this.loop = this.loop.bind(this);
  }

  start(mode='meadow') {
    if (this.running) return;
    this.mode=mode; this.sound.caveMode=mode==='cave';
    if(mode==='cave'){
      this.stage=new CaveStage(this.width,this.height);
      this.mushrooms=[];
      this.cavePuddles=[];
      const notes=[0,1,2,3,4,2,4];
      // At cave entry every mushroom begins ahead of the fairy/chick.
      const rows=[105,285,465];
      for(let row=0;row<rows.length;row++){
        const count=row%2?4:5;
        for(let i=0;i<count;i++)this.mushrooms.push(new CaveMushroom(105+i*(330/(count-1)),rows[row]+(i%2)*18,notes[(i+row)%notes.length],row,i));
      }
      this.cavePuddles=[new CavePuddle(170,205,0),new CavePuddle(382,400,1)];
      this.caveCelebration=0;this.completedMushroomGroups.clear();
      this.birdSpawnTimer=this.catSpawnTimer=this.riverSpawnTimer=this.ledgeSpawnTimer=this.leafPileSpawnTimer=this.flowerSpawnTimer=this.dandelionSpawnTimer=this.sideBranchSpawnTimer=this.rockSpawnTimer=99999;
      this.birds=[];this.cats=[];this.rivers=[];this.ledges=[];this.leafPiles=[];this.flowers=[];this.dandelions=[];this.sideBranches=[];this.rocks=[];this.butterflies=[];this.ladybugs=[];this.frogs=[];
    }
    this.running = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.loop);
  }

  guideChick(direction) { this.chick.guide(direction); this.sound.chick(); }

  registerMushroomNote(note) {
    if (this.mode !== 'cave') return;
    if (this.mushroomNoteTimer > 0 && note !== this.lastMushroomNote) {
      this.mushroomNoteStreak = Math.min(6, this.mushroomNoteStreak + 1);
    } else {
      this.mushroomNoteStreak = 1;
    }
    this.mushroomNoteTimer = .82;
    this.lastMushroomNote = note;
    this.chick.reactToMusic(note, this.mushroomNoteStreak);
  }


  registerMushroomHit(mushroom) {
    this.registerMushroomNote(mushroom.note);
    const group=this.mushrooms.filter(m=>m.groupId===mushroom.groupId);
    const allLit=group.length>=3 && group.every(m=>m.activeTimer>0);
    if(allLit && !this.completedMushroomGroups.has(mushroom.groupId)){
      this.completedMushroomGroups.add(mushroom.groupId);
      this.caveCelebration=2.6;
      this.plus+=100;
      this.sound.caveChord();
      this.chick.reactToMusic(4,5);
      setTimeout(()=>this.completedMushroomGroups.delete(mushroom.groupId),2600);
    }
  }

  triggerPuddleSplash(puddle) {
    this.sound.cavePuddle();
    const nearby=this.mushrooms
      .filter(m=>Math.hypot(m.x-puddle.x,m.y-puddle.y)<205)
      .sort((a,b)=>Math.hypot(a.x-puddle.x,a.y-puddle.y)-Math.hypot(b.x-puddle.x,b.y-puddle.y))
      .slice(0,4);
    nearby.forEach((m,i)=>{
      setTimeout(()=>{
        if(!this.running || this.mode!=='cave')return;
        if(m.waterHit(m.x,m.y,30)){
          this.plus+=25;this.sound.mushroom(m.note);this.registerMushroomHit(m);
        }
      },110+i*115);
    });
  }

  cast(kind, chargeSeconds = 0) {
    if (!this.running || this.cooldowns[kind] > 0) return;
    const isWater = kind === 'water';
    const charge = Math.min(1, Math.max(0, chargeSeconds / 0.9));
    this.cooldowns[kind] = isWater ? 0.60 + charge * .25 : 0.52 + charge * 0.18;
    this.sound.cast(kind, charge);

    // A tap remains one precise water ball. Charged water becomes a gentle
    // sprinkler arc: every small droplet lands on the same radius from the fairy.
    // Wind charge now opens into a two- or three-way fan so it feels as satisfying
    // as charged water without turning the game into rapid-fire shooting.
    const chargedWater = isWater && charge >= .18;
    const count = isWater
      ? (charge < .18 ? 1 : charge < .58 ? 3 : charge < .9 ? 5 : 7)
      : (charge < .30 ? 1 : charge < .74 ? 2 : 3);
    for (let i = 0; i < count; i++) {
      const centered = i - (count - 1) / 2;
      const fanRatio = count > 1 ? centered / ((count - 1) / 2) : 0;
      const startX = this.fairy.x;
      const startY = this.fairy.y - 24;
      const waterRadius = 176;
      const angle = -Math.PI / 2 + fanRatio * (Math.PI * .31);
      const windSideSpeed = isWater ? 0 : fanRatio * (72 + charge * 34);
      const windTravel = 0.64 + charge * 0.46 - Math.abs(fanRatio) * .07;
      this.effects.push({
        x: startX,
        y: startY,
        startX,
        startY,
        targetX: isWater ? (chargedWater ? startX + Math.cos(angle) * waterRadius : startX) : null,
        targetY: isWater ? (chargedWater ? startY + Math.sin(angle) * waterRadius : startY - 158) : null,
        fixedTarget: isWater,
        spreadShot: chargedWater,
        fanShot: !isWater && count > 1,
        airHeight: 0,
        age: 0,
        travel: isWater ? (chargedWater ? .62 : .54) : windTravel,
        burst: isWater ? (chargedWater ? .30 : .38) : 0.38 + charge * 0.14,
        speed: isWater ? 225 : 292 + charge * 20,
        vx: windSideSpeed,
        power: isWater ? (chargedWater ? .62 : 1) : 1.08 + charge * 1.10,
        charge,
        kind,
        phase: 'travel'
      });
    }
  }


  tryFrogSplash(x,y){
    if(this.frogCooldown>0)return;
    const river=this.rivers.find(r=>Math.abs(y-r.y)<r.height*.52 && x>18 && x<this.width-18);
    if(river && Math.random()<.34){this.frogs.push(new RiverFrog(x,river.y+2));this.frogCooldown=3.2;this.sound.frog();}
  }

  drawSunbeams(ctx){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<6;i++){
      const x=(this.width*(.12+i*.19)+Math.sin(this.elapsed*.18+i*1.7)*48)% (this.width+90)-35;
      const y=90+i*150+Math.cos(this.elapsed*.14+i)*42;
      const g=ctx.createRadialGradient(x,y,3,x,y,86+i%2*18);
      g.addColorStop(0,'rgba(255,252,205,.115)');g.addColorStop(.55,'rgba(255,248,190,.055)');g.addColorStop(1,'rgba(255,248,190,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,92,56,.22,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  isSceneryBlocked(x, y, margin = 46) {
    for (const river of this.rivers) {
      if (Math.abs(y - river.y) < river.height * 0.5 + margin) return true;
    }
    for (const ledge of this.ledges) {
      if (Math.abs(y - ledge.y) < ledge.height * 0.5 + margin) return true;
    }
    return false;
  }

  spawnScenery(factory, margin = 46, attempts = 8) {
    for (let i = 0; i < attempts; i++) {
      const item = factory();
      if (!this.isSceneryBlocked(item.x, item.y, margin)) return item;
    }
    return null;
  }

  update(dt) {
    this.elapsed += dt;
    this.distance += dt * 5;
    this.frogCooldown = Math.max(0, this.frogCooldown - dt);
    this.mushroomNoteTimer = Math.max(0, this.mushroomNoteTimer - dt);
    this.caveCelebration = Math.max(0, this.caveCelebration - dt);
    if (this.mushroomNoteTimer <= 0) this.mushroomNoteStreak = 0;
    this.flowerAdmireCooldown = Math.max(0, this.flowerAdmireCooldown - dt);
    this.butterflySpawnTimer -= dt;
    this.ladybugSpawnTimer -= dt;
    if (this.mode==='meadow' && this.butterflySpawnTimer <= 0 && this.butterflies.length < 4) {
      this.butterflies.push(new AmbientButterfly(this.width, this.height));
      this.butterflySpawnTimer = 4 + Math.random() * 5;
    }
    if (this.mode==='meadow' && this.ladybugSpawnTimer <= 0 && this.ladybugs.length < 3) {
      this.ladybugs.push(new AmbientLadybug(this.width, this.height));
      this.ladybugSpawnTimer = 6 + Math.random() * 7;
    }
    for (const butterfly of this.butterflies) butterfly.update(dt, this.elapsed, this.flowers, this.fairy);
    for (const ladybug of this.ladybugs) ladybug.update(dt, this.elapsed);
    for (const frog of this.frogs) frog.update(dt);
    this.stage.update(dt);
    if(this.mode==='cave') {
      for(const p of this.cavePuddles) p.update(dt);
      for(const m of this.mushrooms) m.update(dt);
    }
    this.riverSpawnTimer -= dt;
    this.ledgeSpawnTimer -= dt;
    this.leafPileSpawnTimer -= dt;
    this.flowerSpawnTimer -= dt;
    this.dandelionSpawnTimer -= dt;
    this.sideBranchSpawnTimer -= dt;
    this.rockSpawnTimer -= dt;
    const terrainPresent = this.rivers.length > 0 || this.ledges.length > 0;
    if (!terrainPresent && this.riverSpawnTimer <= 0) {
      this.rivers.push(new River(this.width, this.height));
      this.riverSpawnTimer = 30 + Math.random() * 8;
      this.ledgeSpawnTimer = Math.max(this.ledgeSpawnTimer, 15);
    } else if (!terrainPresent && this.ledgeSpawnTimer <= 0) {
      this.ledges.push(new Ledge(this.width, this.height));
      this.ledgeSpawnTimer = 30 + Math.random() * 8;
      this.riverSpawnTimer = Math.max(this.riverSpawnTimer, 15);
    }
    if (this.leafPileSpawnTimer <= 0 && this.leafPiles.filter(p => p.state === 'rest').length < 2) {
      const pile = this.spawnScenery(() => new LeafPile(this.width, this.height), 58);
      if (pile) this.leafPiles.push(pile);
      this.leafPileSpawnTimer = pile ? 11 + Math.random() * 7 : 2.2;
    }
    for (const pile of this.leafPiles) {
      if (pile.update(dt, this.chick) === 'bump') this.minus += 15;
    }
    if (this.flowerSpawnTimer <= 0 && this.flowers.filter(f => !f.dead).length < 5) {
      const flower = this.spawnScenery(() => new MeadowFlower(this.width, this.height), 54);
      if (flower) this.flowers.push(flower);
      this.flowerSpawnTimer = flower ? 5.4 + Math.random() * 3.8 : 2.0;
    }
    for (const flower of this.flowers) flower.update(dt);
    if (this.dandelionSpawnTimer <= 0 && this.dandelions.filter(d => !d.dead).length < 2) {
      const dandelion = this.spawnScenery(() => new Dandelion(this.width, this.height), 54);
      if (dandelion) {
        this.dandelions.push(dandelion);
        // Sometimes a second puff grows nearby, making a tiny colony rather than random confetti.
        if (Math.random() < .52 && this.dandelions.filter(d => !d.dead).length < 3) {
          const friend = new Dandelion(this.width, this.height);
          friend.x = Math.max(48, Math.min(this.width - 48, dandelion.x + (Math.random() < .5 ? -1 : 1) * (34 + Math.random() * 24)));
          friend.y = dandelion.y + 9 + Math.random() * 15;
          if (!this.isSceneryBlocked(friend.x, friend.y, 50)) this.dandelions.push(friend);
        }
      }
      this.dandelionSpawnTimer = dandelion ? 13 + Math.random() * 9 : 2.0;
    }
    for (const d of this.dandelions) d.update(dt);
    if (this.sideBranchSpawnTimer <= 0 && this.sideBranches.filter(b => !b.dead).length < 2) {
      const kind = Math.random() < .58 ? 'leafy' : 'dead';
      const branch = this.spawnScenery(() => new SideBranch(this.width, this.height, kind), 72, 10);
      if (branch) this.sideBranches.push(branch);
      this.sideBranchSpawnTimer = branch ? 13 + Math.random() * 8 : 2.5;
    }
    for (const branch of this.sideBranches) {
      if (branch.update(dt, this.chick) === 'bump') this.minus += 12;
    }
    if (this.rockSpawnTimer <= 0 && this.rocks.filter(r => !r.dead).length < 2) {
      const rock = this.spawnScenery(() => new WindRock(this.width, this.height), 62, 10);
      if (rock) this.rocks.push(rock);
      this.rockSpawnTimer = rock ? 15 + Math.random() * 9 : 2.5;
    }
    for (const rock of this.rocks) {
      if (rock.update(dt, this.chick) === 'bump') this.minus += 18;
    }
    for (const river of this.rivers) river.update(dt, this.chick);
    for (const ledge of this.ledges) ledge.update(dt, this.chick);

    // A missed steering cue never ends the stroll. After a short pause, apply
    // a small penalty and guide only the chick to the nearest completed route.
    for (const terrain of [...this.rivers, ...this.ledges]) {
      const rescueX = terrain.takeRescueRequest?.();
      if (rescueX != null) {
        this.minus += 20;
        this.chick.assistTo(rescueX);
        break;
      }
    }
    const guideX = [
      ...this.rivers.map(r => r.getGuidance(this.chick)),
      ...this.ledges.map(l => l.getGuidance(this.chick))
    ].find(x => x !== null && x !== undefined);
    this.chick.setAutoTarget(guideX ?? null);
    // When a complete crossing exists but the chick is stopped away from it,
    // softly suggest the useful steering direction without forcing movement.
    let hintTarget = null;
    for (const terrain of [...this.rivers, ...this.ledges]) {
      if (!terrain.blocking) continue;
      const slots = terrain.slots.filter(s => s.complete);
      if (!slots.length) continue;
      const nearest = slots.reduce((a,b) => Math.abs(a.x-this.chick.x) < Math.abs(b.x-this.chick.x) ? a : b);
      hintTarget = nearest.x;
      break;
    }
    const hintDx = hintTarget == null ? 0 : hintTarget - this.chick.x;
    this.leftHintButton?.classList.toggle('hint', hintDx < -24);
    this.rightHintButton?.classList.toggle('hint', hintDx > 24);
    const moveVector = this.input.getVector();
    this.fairy.update(dt, moveVector, this.width, this.height);
    if (Math.hypot(moveVector.x, moveVector.y) > .18) this.sound.wings(Math.hypot(moveVector.x, moveVector.y));
    this.chick.update(dt, this.elapsed);
    if(this.flowerAdmireCooldown<=0 && !this.rivers.some(r=>r.blocking) && !this.ledges.some(l=>l.blocking)){
      const nearby=this.flowers.find(f=>!f.dead && f.buds?.some(b=>b.state==='open') && Math.abs(f.y-this.chick.y)<48 && Math.abs(f.x-this.chick.x)<92);
      if(nearby && Math.random()<.018){this.chick.admireFlower(nearby.x);this.flowerAdmireCooldown=5+Math.random()*4;}
    }
    this.cooldowns.wind = Math.max(0, this.cooldowns.wind - dt);
    this.cooldowns.water = Math.max(0, this.cooldowns.water - dt);

    // Keep the pace gentle: only one approaching animal is normally present.
    const threatPresent = this.birds.some(b => b.state === 'approach') || this.cats.some(c => c.state === 'approach');
    this.birdSpawnTimer -= dt;
    this.catSpawnTimer -= dt;
    if (!threatPresent) {
      if (this.birdSpawnTimer <= 0 && this.catSpawnTimer > 0) {
        this.birds.push(new Bird(this.width, this.height, Math.floor(Math.random() * 3)));
        this.birdSpawnTimer = 7.0 + Math.random() * 4.0;
        this.catSpawnTimer = Math.max(this.catSpawnTimer, 5.5);
      } else if (this.catSpawnTimer <= 0) {
        // Alternate between warm tabby and soft grey cats.
        const catVariant = Math.random() < 0.5 ? 0 : 1;
        this.cats.push(new Cat(this.width, this.height, catVariant));
        this.catSpawnTimer = 9.0 + Math.random() * 5.0;
        this.birdSpawnTimer = Math.max(this.birdSpawnTimer, 5.0);
      }
    }
    for (const bird of this.birds) {
      bird.update(dt, this.chick, this.elapsed);
      if (bird.state === 'approach' && Math.hypot(bird.x - this.chick.x, bird.y - this.chick.y) < 34) {
        this.minus += 25;
        bird.scare(this.chick.x, this.chick.y + 25);
      }
    }
    for (const cat of this.cats) {
      cat.update(dt, this.chick, this.elapsed);
      if (cat.state === 'approach' && Math.hypot(cat.x - this.chick.x, cat.y - this.chick.y) < 38) {
        this.minus += 30;
        cat.scare(this.chick.x, this.chick.y + 28);
      }
    }

    for (const e of this.effects) {
      const phaseBefore = e.phase;
      e.age += dt;
      if (e.phase === 'travel') {
        if (e.fixedTarget) {
          const p = Math.min(1, e.age / e.travel);
          const eased = 1 - Math.pow(1 - p, 2);
          e.x = e.startX + (e.targetX - e.startX) * eased;
          e.y = e.startY + (e.targetY - e.startY) * eased;
          // The ball visibly rises and then settles back onto the ground.
          // The last third falls a little faster, so even a normal tap reads
          // as a thrown water ball rather than a flat blue projectile.
          const arc = Math.sin(p * Math.PI);
          e.airHeight = arc * (e.spreadShot ? 16 : 22) + (p > .68 ? (1 - p) * 5 : 0);
        } else {
          e.y -= e.speed * dt;
          e.x += (e.vx || 0) * dt + Math.sin(e.age * 10) * (e.kind === 'wind' ? 0.8 : 0.25);
        }
        if (e.kind === 'water') {
          if(this.mode==='cave'){
            for(const m of this.mushrooms){if(m.waterHit(e.x,e.y,e.spreadShot?13:20)){this.plus+=25;this.sound.mushroom(m.note);this.registerMushroomHit(m);e.phase='burst';e.age=0;break;}}
          }
          this.tryFrogSplash(e.x,e.y);
          for (const river of this.rivers) {
            const grown = river.waterHit(e.x, e.y, e.spreadShot ? 12 : 18);
            if (grown) {
              if (grown.kind === 'bridge') { this.plus += 100; this.sound.grow('bridge'); }
              else if (grown.kind === 'bridgeFlowers') { this.plus += 80; this.sound.flower(3); }
              else if (grown.kind === 'bridgeEnd') { this.plus += 20; this.sound.flower(1); }
              e.phase = 'burst';
              e.age = 0;
              break;
            }
          }
          if (e.phase === 'travel') {
            for (const flower of this.flowers) {
              const bloomed = flower.waterHit(e.x, e.y, e.spreadShot ? 13 : 20);
              if (bloomed) {
                this.plus += 40 * bloomed; this.sound.flower(bloomed);
                e.phase = 'burst';
                e.age = 0;
                break;
              }
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind' && this.mode==='cave') {
          for (const puddle of this.cavePuddles) {
            if (puddle.windHit(e.x,e.y,20+(e.charge||0)*18)) {
              this.triggerPuddleSplash(puddle); e.phase='burst'; e.age=0; break;
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind') {
          for (const pile of this.leafPiles) {
            if (pile.windHit(e.x, e.y, 18 + (e.charge || 0) * 16)) {
              this.plus += 30; this.sound.leaves();
              e.phase = 'burst';
              e.age = 0;
              break;
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind') {
          for (const d of this.dandelions) {
            if (d.windHit(e.x, e.y, 18 + (e.charge || 0) * 16)) {
              this.plus += 45; this.sound.dandelion(); e.phase = 'burst'; e.age = 0; break;
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind') {
          for (const branch of this.sideBranches) {
            if (branch.windHit(e.x, e.y, 18 + (e.charge || 0) * 16)) {
              this.plus += 40; this.sound.leaves(); e.phase = 'burst'; e.age = 0; break;
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind') {
          const gustRadius = 18 + (e.charge || 0) * 22;
          for (const b of this.butterflies) b.gust(e.x, e.y, gustRadius * .8);
          for (const l of this.ladybugs) l.gust(e.x, e.y, gustRadius * .7);
          for (const rock of this.rocks) {
            const hit = rock.windHit(e.x, e.y, 18 + (e.charge || 0) * 16);
            if (hit) {
              this.plus += hit === 2 ? 40 : 15; this.sound.rock(hit === 2);
              e.phase = 'burst'; e.age = 0; break;
            }
          }
        }
        if (e.phase === 'travel' && e.kind === 'wind') {
          for (const ledge of this.ledges) {
            const carved = ledge.windHit(e.x, e.y, 18 + (e.charge || 0) * 14);
            if (carved) {
              this.plus += 100; this.sound.grow('ledge');
              e.phase = 'burst';
              e.age = 0;
              break;
            }
          }
        }
        // A direct hit scares the bird immediately.
        if (e.phase === 'travel') for (const bird of this.birds) {
          if (bird.state === 'approach' && Math.hypot(e.x - bird.x, e.y - bird.y) < bird.hitRadius + 18) {
            if (bird.scare(e.x, e.y)) { this.plus += 50; this.sound.scare('bird'); }
            e.phase = 'burst';
            e.age = 0;
            break;
          }
        }
        if (e.phase === 'travel') {
          for (const cat of this.cats) {
            if (cat.state === 'approach' && Math.hypot(e.x - cat.x, e.y - cat.y) < cat.hitRadius + 18) {
              if (cat.scare(e.x, e.y)) { this.plus += 60; this.sound.scare('cat'); }
              e.phase = 'burst';
              e.age = 0;
              break;
            }
          }
        }
        if (e.age >= e.travel) {
          e.phase = 'burst';
          e.age = 0;
        }
      } else {
        const t = e.age / e.burst;
        const radius = e.kind === 'wind' ? 20 + t * 72 * (e.power || 1) : 11 + t * 42 * (e.power || 1);
        if (e.kind === 'wind') {
          if(this.mode==='cave'){
            for(const puddle of this.cavePuddles){
              if(puddle.windHit(e.x,e.y,radius*.58)) this.triggerPuddleSplash(puddle);
            }
          }
          for (const pile of this.leafPiles) {
            if (pile.windHit(e.x, e.y, radius * .62)) { this.plus += 30; this.sound.leaves(); }
          }
          for (const ledge of this.ledges) {
            const carved = ledge.windHit(e.x, e.y, radius * .55);
            if (carved) { this.plus += 100; this.sound.grow('ledge'); }
          }
          for (const d of this.dandelions) {
            if (d.windHit(e.x, e.y, radius * .55)) { this.plus += 45; this.sound.dandelion(); }
          }
          for (const branch of this.sideBranches) {
            if (branch.windHit(e.x, e.y, radius * .58)) { this.plus += 40; this.sound.leaves(); }
          }
          for (const rock of this.rocks) {
            const hit = rock.windHit(e.x, e.y, radius * .55);
            if (hit) { this.plus += hit === 2 ? 40 : 15; this.sound.rock(hit === 2); } this.sound.rock(hit === 2);
          }
        } else {
          if(this.mode==='cave'){for(const m of this.mushrooms){if(m.waterHit(e.x,e.y,radius*.62)){this.plus+=25;this.sound.mushroom(m.note);this.registerMushroomHit(m);}}}
          if(!e.frogChecked){this.tryFrogSplash(e.x,e.y);e.frogChecked=true;}
          for (const flower of this.flowers) {
            const bloomed = flower.waterHit(e.x, e.y, radius * .62);
            if (bloomed) this.plus += 40 * bloomed; this.sound.flower(bloomed);
          }
          for (const river of this.rivers) {
            const grown = river.waterHit(e.x, e.y, radius * .55);
            if (grown) {
              if (grown.kind === 'bridge') { this.plus += 100; this.sound.grow('bridge'); }
              else if (grown.kind === 'bridgeFlowers') { this.plus += 80; this.sound.flower(3); }
              else if (grown.kind === 'bridgeEnd') { this.plus += 20; this.sound.flower(1); }
            }
          }
        }
        for (const bird of this.birds) {
          if (bird.state === 'approach' && Math.hypot(e.x - bird.x, e.y - bird.y) < radius + bird.hitRadius) {
            if (bird.scare(e.x, e.y)) { this.plus += 50; this.sound.scare('bird'); }
          }
        }
        for (const cat of this.cats) {
          if (cat.state === 'approach' && Math.hypot(e.x - cat.x, e.y - cat.y) < radius + cat.hitRadius) {
            if (cat.scare(e.x, e.y)) { this.plus += 60; this.sound.scare('cat'); }
          }
        }
      }
      if (phaseBefore === 'travel' && e.phase === 'burst') this.sound.impact(e.kind, e.power || 1, !!e.spreadShot);
    }
    this.effects = this.effects.filter(e => e.phase !== 'burst' || e.age < e.burst);
    this.birds = this.birds.filter(bird => !bird.isOffscreen());
    this.cats = this.cats.filter(cat => !cat.isOffscreen());
    this.rivers = this.rivers.filter(river => !river.dead);
    this.ledges = this.ledges.filter(ledge => !ledge.dead);
    this.leafPiles = this.leafPiles.filter(pile => !pile.dead);
    this.flowers = this.flowers.filter(flower => !flower.dead);
    this.dandelions = this.dandelions.filter(d => !d.dead);
    this.sideBranches = this.sideBranches.filter(b => !b.dead);
    this.rocks = this.rocks.filter(r => !r.dead);
    this.butterflies=this.butterflies.filter(b=>!b.dead);
    this.ladybugs=this.ladybugs.filter(l=>!l.dead);
    this.frogs=this.frogs.filter(f=>!f.dead);
    if (this.minus > this.previousMinus) this.sound.penalty();
    this.previousMinus = this.minus;
    this.hud.distance.textContent = `${Math.floor(this.distance)} m`;
    this.hud.plus.textContent = this.plus;
    this.hud.minus.textContent = this.minus;
  }

  drawWindTravel(ctx, e) {
    // Keep the projectile compact all the way to impact. The rings spin
    // quickly inside a stable cone, so the last frame never stretches into
    // a long feather-like shape.
    const charge = e.charge || 0;
    const scale = 1 + charge * .42;
    ctx.scale(scale, scale);
    ctx.rotate(Math.sin(e.age * 18) * .025);
    ctx.globalCompositeOperation = 'lighter';

    const layers = 5;
    for (let i = 0; i < layers; i++) {
      const y = 12 - i * 7;
      const width = 7 + i * 4.1;
      const spin = e.age * 22 + i * 1.18;
      const squash = .82 + Math.sin(spin) * .08;
      ctx.strokeStyle = `rgba(${185 + i * 10},255,${205 + i * 8},${.48 + i * .07})`;
      ctx.lineWidth = 4.5 - i * .45;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(Math.sin(spin) * 1.35, y, width, (3.7 + i * .42) * squash, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    const glow = ctx.createRadialGradient(0, -4, 1, 0, -4, 27);
    glow.addColorStop(0, 'rgba(245,255,246,.72)');
    glow.addColorStop(.45, 'rgba(143,244,171,.22)');
    glow.addColorStop(1, 'rgba(74,216,130,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.ellipse(0, -2, 25, 31, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = e.age * 8 + i * Math.PI / 2;
      ctx.fillStyle = 'rgba(220,255,228,.7)';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (17 + i), -3 + Math.sin(a) * 10, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawWaterTravel(ctx, e) {
    const r = e.spreadShot ? 12.5 : 18;
    const g = ctx.createRadialGradient(-6, -7, 2, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.22, 'rgba(95,205,255,.98)');
    g.addColorStop(.68, 'rgba(0,123,239,.94)');
    g.addColorStop(1, 'rgba(0,63,170,.62)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.beginPath(); ctx.ellipse(-6, -7, 5, 3, -.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(71,183,255,.65)';
    ctx.beginPath(); ctx.arc(10, 9, 3, 0, Math.PI * 2); ctx.fill();
  }

  drawBurst(ctx, e) {
    const t = e.age / e.burst;
    ctx.globalAlpha = Math.max(0, 1 - t);
    if (e.kind === 'wind') {
      const r = 20 + t * 72 * (e.power || 1);
      ctx.strokeStyle = `rgba(207,255,220,${0.9 - t * 0.6})`;
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.lineCap = 'round';
      // The mini tornado loosens into two curved gusts instead of exploding.
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        const startA = arm * Math.PI + e.age * 3;
        for (let j = 0; j <= 18; j++) {
          const q = j / 18;
          const rr = r * (.28 + q * .72);
          const a = startA + q * Math.PI * 1.35;
          const px = Math.cos(a) * rr;
          const py = Math.sin(a) * rr * .72;
          if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.strokeStyle = `rgba(255,255,255,${0.62 - t * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, r * .72, r * .42, e.age * 2, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 7; i++) {
        const a = i * Math.PI * 2 / 7 + e.age * 2;
        const d = 14 + t * 58;
        ctx.fillStyle = `rgba(187,247,202,${0.7 - t * 0.55})`;
        ctx.beginPath(); ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, 5, 2, a, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      const r = 11 + t * 42 * (e.power || 1);
      ctx.strokeStyle = `rgba(43,157,255,${0.88 - t * 0.65})`;
      ctx.lineWidth = 7 * (1 - t) + 1;
      ctx.beginPath(); ctx.ellipse(0, 5, r, r * 0.48, 0, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI * 2 / 10;
        const d = 9 + t * 39;
        const drop = 2.8 + (i % 3) * 1.2;
        ctx.fillStyle = `rgba(${i % 2 ? '64,177,255' : '129,218,255'},${0.9 - t * 0.7})`;
        ctx.beginPath(); ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d * 0.58, drop, drop * 1.5, a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = `rgba(220,247,255,${0.65 - t * 0.5})`;
      ctx.beginPath(); ctx.ellipse(0, 5, r * .65, r * .23, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawEffect(e) {
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.phase === 'travel') {
      if (e.kind === 'wind') this.drawWindTravel(ctx, e);
      else {
        const h = e.airHeight || 0;
        // Ground shadow makes the short arc readable from the top-down camera.
        ctx.save();
        ctx.globalAlpha = .18 + Math.max(0, 1 - h / 28) * .12;
        ctx.fillStyle = '#174f78';
        ctx.beginPath();
        ctx.ellipse(0, 5, e.spreadShot ? 8 : 12, e.spreadShot ? 3 : 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.translate(0, -h);
        this.drawWaterTravel(ctx, e);
      }
    } else {
      this.drawBurst(ctx, e);
    }
    ctx.restore();
  }

  draw() {
    this.stage.draw(this.ctx, this.elapsed);
    if(this.mode==='cave') {
      for(const p of this.cavePuddles) p.draw(this.ctx,this.elapsed);
      for(const m of this.mushrooms) m.draw(this.ctx,this.elapsed);
    }
    for (const river of this.rivers) river.draw(this.ctx, this.elapsed);
    for (const frog of this.frogs) frog.draw(this.ctx, this.elapsed);
    for (const ledge of this.ledges) ledge.draw(this.ctx, this.elapsed);
    for (const pile of this.leafPiles) pile.draw(this.ctx, this.elapsed);
    for (const flower of this.flowers) flower.draw(this.ctx, this.elapsed);
    for (const ladybug of this.ladybugs) ladybug.draw(this.ctx, this.elapsed);
    for (const butterfly of this.butterflies) butterfly.draw(this.ctx, this.elapsed);
    for (const d of this.dandelions) d.draw(this.ctx, this.elapsed);
    for (const branch of this.sideBranches) branch.draw(this.ctx, this.elapsed);
    for (const rock of this.rocks) rock.draw(this.ctx, this.elapsed);
    this.chick.draw(this.ctx, this.elapsed);
    for (const cat of this.cats) cat.draw(this.ctx, this.elapsed);
    for (const bird of this.birds) bird.draw(this.ctx, this.elapsed);
    for (const e of this.effects) this.drawEffect(e);
    if(this.mode==='meadow') this.drawSunbeams(this.ctx);
    if(this.mode==='cave' && this.caveCelebration>0){
      const t=Math.min(1,this.caveCelebration/1.1);
      this.ctx.save();this.ctx.globalCompositeOperation='screen';
      const g=this.ctx.createRadialGradient(this.width/2,this.height*.52,35,this.width/2,this.height*.52,430);
      g.addColorStop(0,`rgba(125,255,232,${.17*t})`);g.addColorStop(.55,`rgba(98,210,255,${.09*t})`);g.addColorStop(1,'rgba(70,170,220,0)');
      this.ctx.fillStyle=g;this.ctx.fillRect(0,0,this.width,this.height);
      for(let i=0;i<16;i++){const a=i*.9+this.elapsed*.55;const r=55+(i%5)*50;this.ctx.fillStyle=`rgba(215,255,246,${.22*t})`;this.ctx.beginPath();this.ctx.arc(this.width/2+Math.cos(a)*r,this.height*.52+Math.sin(a)*r*.55,1.8+(i%3),0,Math.PI*2);this.ctx.fill();}
      this.ctx.restore();
    }
    this.fairy.draw(this.ctx, this.elapsed, this.chick);
  }

  loop(now) {
    if (!this.running) return;
    const dt = Math.min(.033, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.update(dt);
    this.draw();
    requestAnimationFrame(this.loop);
  }
}




const canvas = document.querySelector('#gameCanvas');
const titleScreen = document.querySelector('#titleScreen');
const startButton = document.querySelector('#startButton');
const caveButton = document.querySelector('#caveButton');
const controls = document.querySelector('#controls');
const hudElement = document.querySelector('#hud');

const input = new InputController(
  document.querySelector('#stick'),
  document.querySelector('#stickKnob')
);

const game = new Game(canvas, input, {
  distance: document.querySelector('#distanceText'),
  plus: document.querySelector('#plusScore'),
  minus: document.querySelector('#minusScore')
});

startButton.addEventListener('click', () => {
  sound.unlock();
  titleScreen.classList.add('hidden');
  controls.classList.remove('hidden');
  hudElement.classList.remove('hidden');
  game.start('meadow');
});

caveButton.addEventListener('click', () => {
  sound.unlock();
  titleScreen.classList.add('hidden');
  controls.classList.remove('hidden');
  hudElement.classList.remove('hidden');
  game.start('cave');
});


const soundButton = document.querySelector('#soundButton');
soundButton.addEventListener('click', (e) => {
  e.preventDefault();
  sound.unlock();
  sound.setMuted(!sound.muted);
  soundButton.textContent = sound.muted ? '🔇' : '🔊';
  soundButton.classList.toggle('muted', sound.muted);
  soundButton.setAttribute('aria-label', sound.muted ? '効果音をオンにする' : '効果音をオフにする');
});

const windButton = document.querySelector('#windButton');
let windChargeStarted = 0;
let windChargeFrame = 0;

function updateWindChargeMeter() {
  if (!windChargeStarted) return;
  const ratio = Math.min(1, (performance.now() - windChargeStarted) / 900);
  windButton.style.setProperty('--charge', ratio.toFixed(3));
  windChargeFrame = requestAnimationFrame(updateWindChargeMeter);
}

function releaseWind(e) {
  if (!windChargeStarted) return;
  e?.preventDefault();
  const seconds = Math.min(0.9, (performance.now() - windChargeStarted) / 1000);
  windChargeStarted = 0;
  cancelAnimationFrame(windChargeFrame);
  windButton.classList.remove('charging');
  windButton.style.setProperty('--charge', '0');
  game.cast('wind', seconds);
}

windButton.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (windChargeStarted) return;
  windChargeStarted = performance.now();
  windButton.classList.add('charging');
  windButton.setPointerCapture?.(e.pointerId);
  updateWindChargeMeter();
});
windButton.addEventListener('pointerup', releaseWind);
windButton.addEventListener('pointercancel', releaseWind);
const waterButton = document.querySelector('#waterButton');
let waterChargeStarted = 0;
let waterChargeFrame = 0;

function updateWaterChargeMeter() {
  if (!waterChargeStarted) return;
  const ratio = Math.min(1, (performance.now() - waterChargeStarted) / 900);
  waterButton.style.setProperty('--charge', ratio.toFixed(3));
  waterChargeFrame = requestAnimationFrame(updateWaterChargeMeter);
}

function releaseWater(e) {
  if (!waterChargeStarted) return;
  e?.preventDefault();
  const seconds = Math.min(.9, (performance.now() - waterChargeStarted) / 1000);
  waterChargeStarted = 0;
  cancelAnimationFrame(waterChargeFrame);
  waterButton.classList.remove('charging');
  waterButton.style.setProperty('--charge', '0');
  game.cast('water', seconds);
}

waterButton.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (waterChargeStarted) return;
  waterChargeStarted = performance.now();
  waterButton.classList.add('charging');
  waterButton.setPointerCapture?.(e.pointerId);
  updateWaterChargeMeter();
});
waterButton.addEventListener('pointerup', releaseWater);
waterButton.addEventListener('pointercancel', releaseWater);
document.querySelector('#chickLeftButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(-1);
});
document.querySelector('#chickRightButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.guideChick(1);
});

// Prevent mobile long-press selection/callout menus on the game UI.
document.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });
document.addEventListener('selectstart', (e) => e.preventDefault(), { passive: false });
document.addEventListener('dragstart', (e) => e.preventDefault(), { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'm') { soundButton.click(); return; }
  if (e.key === 'j' && !e.repeat) game.cast('wind', 0.35);
  if (e.key === 'k' && !e.repeat) game.cast('water', .5);
  if (e.key === 'q') game.guideChick(-1);
  if (e.key === 'e') game.guideChick(1);
});

</script>
