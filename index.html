<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Fairy Guardian Prototype v2.8</title>
<style>
  :root{--bg:#f5f0df;--panel:#fff9ea;--line:#ceb987;--green:#2ca35a;--blue:#36a9e1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
  html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#473b2b;overflow:hidden}
  body{display:flex;justify-content:center}
  #app{width:min(100vw,520px);height:100dvh;display:grid;grid-template-rows:1fr 178px;background:#203a25}
  #gameWrap{position:relative;min-height:0;background:#4f9d48;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;padding:10px 12px;pointer-events:none;font-weight:800;text-shadow:0 1px 2px #fff}
  .pill{background:rgba(255,255,255,.82);border:2px solid rgba(96,88,59,.35);border-radius:999px;padding:5px 10px}
  #toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:5px 12px;font-weight:800;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none}
  #controls{background:var(--panel);border-top:3px solid var(--line);display:grid;grid-template-columns:174px 1fr;gap:8px;padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));align-items:center}
  #stick{width:150px;height:150px;border-radius:50%;margin:auto;position:relative;background:radial-gradient(circle,#fdfcf6 0 42%,#e8dfc4 43% 68%,#c9ba8f 69% 72%,#efe7cf 73%);box-shadow:inset 0 2px 7px #a89b75,0 2px 4px #b9ac86}
  #knob{position:absolute;width:62px;height:62px;left:44px;top:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c8b98a 70%);border:3px solid #9e8f67;box-shadow:0 3px 7px #8f805a}
  #magic{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{font:inherit;font-weight:900;border:0;border-radius:16px;min-height:70px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .wind{background:linear-gradient(#62d789,#209952)} .water{background:linear-gradient(#72d5ff,#278dc6)}
  .sub{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
  #overlay{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.91),rgba(244,238,206,.95));display:flex;align-items:center;justify-content:center;padding:24px;z-index:4}
  #card{width:min(360px,92%);background:#fffdf3;border:4px solid #d2bc79;border-radius:26px;padding:22px;text-align:center;box-shadow:0 16px 40px rgba(57,51,31,.25)}
  h1{margin:0 0 8px;font-size:28px} p{line-height:1.55;margin:8px 0 18px}
  #start,#restart{width:100%;min-height:58px;background:linear-gradient(#ffd85c,#e7a91d);color:#5b3d00}
  #result{display:none}
  @media (max-height:700px){#app{grid-template-rows:1fr 150px}#stick{width:126px;height:126px}#knob{left:37px;top:37px;width:52px;height:52px}#controls{grid-template-columns:144px 1fr}button{min-height:58px}}
</style>
</head>
<body>
<div id="app">
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="hud"><div class="pill">＋ <span id="plus">0</span></div><div class="pill">− <span id="minus">0</span></div><div class="pill"><span id="distance">300</span>m</div></div>
    <div id="toast"></div>
    <div id="overlay">
      <div id="card">
        <div id="intro"><h1>Fairy Guardian</h1><p>気まぐれなヒヨコを、風と水の魔法で守ろう。<br>点数がマイナスになってもゲームは続きます。</p><button id="start">スタート</button></div>
        <div id="result"><h1>ゴール！</h1><p>プラス <b id="rPlus">0</b>点<br>マイナス <b id="rMinus">0</b>点</p><button id="restart">もう一度</button></div>
      </div>
    </div>
  </div>
  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <div id="magic">
      <button class="wind" id="windUp">風・上<span class="sub">前方エアーブラスト</span></button>
      <button class="wind" id="windDown">風・下<span class="sub">近距離ブラスト</span></button>
      <button class="water" id="waterUp">水・上<span class="sub">前方ウォーターボール</span></button>
      <button class="water" id="waterDown">水・下<span class="sub">真下ウォーターボール</span></button>
    </div>
  </div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('gameWrap');
const overlay=document.getElementById('overlay'),intro=document.getElementById('intro'),result=document.getElementById('result');
const plusEl=document.getElementById('plus'),minusEl=document.getElementById('minus'),distEl=document.getElementById('distance');
let W=360,H=640,dpr=1,running=false,last=0,spawnT=0,worldT=0,plus=0,minus=0,distance=600;
let particles=[],effects=[],shots=[],enemies=[],obstacles=[];
const fairy={x:180,y:390,r:16,speed:250};
const chick={x:180,y:550,r:12,vx:0,vy:0,wander:0,stuck:null,bounce:0,jumpBoost:0};
const input={x:0,y:0};
const cooldown={windUp:0,windDown:0,waterUp:0,waterDown:0};
const cooldownTime={windUp:.55,windDown:.62,waterUp:.78,waterDown:.72};
function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);fairy.x=Math.min(fairy.x,W-20);chick.x=Math.min(chick.x,W-20)}
addEventListener('resize',resize);resize();
function reset(){plus=minus=0;distance=600;worldT=spawnT=0;shots=[];particles=[];effects=[];enemies=[];obstacles=[];fairy.x=W*.5;fairy.y=H*.62;chick.x=W*.5;chick.y=H*.84;chick.vx=chick.vy=0;chick.wander=0;chick.stuck=null;chick.jumpBoost=0;for(let i=0;i<7;i++)spawnObstacle(-i*105-120);for(let i=0;i<4;i++)spawnEnemy(-i*170-80);updateHud()}
function startGame(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',startGame);
document.getElementById('restart').addEventListener('click',()=>{intro.style.display='block';result.style.display='none';startGame()});
function updateHud(){plusEl.textContent=plus;minusEl.textContent=minus;distEl.textContent=Math.max(0,Math.ceil(distance));[['windUp','windUp'],['windDown','windDown'],['waterUp','waterUp'],['waterDown','waterDown']].forEach(([id,k])=>{const b=document.getElementById(id),q=cooldown[k]/cooldownTime[k];b.style.filter=q>0?'saturate(.55) brightness(.88)':'none';b.style.opacity=q>0?.72:1})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,550)}
function addPlus(n,label){plus+=n;toast(`＋${n} ${label||''}`);updateHud()}
function addMinus(n,label){minus+=n;toast(`−${n} ${label||''}`);updateHud()}
// 8 direction analog stick
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
function setStick(px,py){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=px-cx,dy=py-cy;const max=r.width*.31,mag=Math.hypot(dx,dy);if(mag>max){dx*=max/mag;dy*=max/mag}knob.style.transform=`translate(${dx}px,${dy}px)`;if(mag<10){input.x=input.y=0;return}let a=Math.atan2(dy,dx);let step=Math.round(a/(Math.PI/4));a=step*Math.PI/4;input.x=Math.cos(a);input.y=Math.sin(a)}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e.clientX,e.clientY)});
function release(e){if(stickId===null||!e||e.pointerId===stickId){stickId=null;input.x=input.y=0;knob.style.transform='translate(0,0)'}}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['a','b','c','d'].includes(e.key.toLowerCase()))fireByKey(e.key.toLowerCase())});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function fireByKey(k){({a:fireWindUp,b:fireWindDown,c:fireWaterUp,d:fireWaterDown}[k]||(()=>{}))()}
['windUp','windDown','waterUp','waterDown'].forEach((id,i)=>document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();[fireWindUp,fireWindDown,fireWaterUp,fireWaterDown][i]()}));
function cast(type,shot){if(!running||cooldown[type]>0)return;cooldown[type]=cooldownTime[type];shots.push(shot)}
function fireWindUp(){cast('windUp',{type:'windUp',x:fairy.x,y:fairy.y-16,vx:0,vy:-270,t:0,life:.88,r:14})}
function fireWindDown(){cast('windDown',{type:'windDown',x:fairy.x,y:fairy.y+12,vx:0,vy:78,t:0,life:.27,r:18})}
function fireWaterUp(){cast('waterUp',{type:'waterUp',x:fairy.x,y:fairy.y-10,vx:0,vy:-210,t:0,life:.76,r:12,height:36})}
function fireWaterDown(){cast('waterDown',{type:'waterDown',x:fairy.x,y:fairy.y+8,vx:0,vy:46,t:0,life:.38,r:13,height:20})}
function spawnEnemy(y=-60){const air=Math.random()<.38;const type=air?'bird':(Math.random()<.5?'fox':'cat');enemies.push({type,air,x:42+Math.random()*(W-84),y,r:air?20:18,vx:(Math.random()-.5)*18,vy:air?44:30,hp:1,cool:0,anim:Math.random()*10,angle:Math.PI/2,flee:false,fleeT:0})}
function spawnObstacle(y=-70){const p=Math.random();let type=p<.34?'leafPile':p<.66?'ledge':'sproutWater';let w,h,x;if(type==='leafPile'){w=96+Math.random()*54;h=48;x=w/2+18+Math.random()*Math.max(20,W-w-36)}else{w=W+24;x=W/2;h=type==='ledge'?42:62}obstacles.push({type,x,y,w,h,done:false,hit:false,growing:false,growth:0,seed:Math.random()*1000})}
function crossLedge(o){if(o.done)return;o.done=true;chick.stuck=null;chick.y=Math.max(H*.58,chick.y-o.h-22);addPlus(80,'大ジャンプで段差を越えた');effects.push({type:'sparkle',x:chick.x,y:chick.y,t:0,life:.55,r:34});burst(chick.x,chick.y,'wind')}
function update(dt){worldT+=dt;chick.jumpBoost=Math.max(0,chick.jumpBoost-dt);for(const k in cooldown)cooldown[k]=Math.max(0,cooldown[k]-dt);distance-=dt*6;if(distance<=0){finish();return}
 let ix=input.x+(keys.arrowleft?-1:0)+(keys.arrowright?1:0),iy=input.y+(keys.arrowup?-1:0)+(keys.arrowdown?1:0);let m=Math.hypot(ix,iy);if(m>0){ix/=m;iy/=m}fairy.x+=ix*fairy.speed*dt;fairy.y+=iy*fairy.speed*dt;fairy.x=Math.max(18,Math.min(W-18,fairy.x));fairy.y=Math.max(55,Math.min(H-26,fairy.y));
 const scroll=38;spawnT+=dt;if(spawnT>2.15){spawnT=0;(Math.random()<.38?spawnEnemy:spawnObstacle)()}
 for(const e of enemies){const ox=e.x,oy=e.y;e.cool-=dt;
   if(e.flee){
     e.fleeT+=dt;
     const side=e.x<W/2?-1:1;
     e.x+=side*(e.air?115:82)*dt;
     e.y+=(e.air?-125:-82)*dt;
     e.angle=Math.atan2(-1,side);
   }else{
     e.y+=scroll*dt+e.vy*dt;e.x+=e.vx*dt;
     if(!e.air){const dx=chick.x-e.x,dy=chick.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*13*dt;e.y+=dy/d*13*dt}
     const mdx=e.x-ox,mdy=e.y-oy;if(Math.hypot(mdx,mdy)>.01)e.angle=Math.atan2(mdy,mdx);
     if(dist(e,chick)<e.r+chick.r&&e.cool<=0){e.cool=1.4;addMinus(e.air?90:70,'ヒヨコがびっくり');e.vy=-80}
   }
 }
 enemies=enemies.filter(e=>e.y<H+90&&e.y>-130&&e.x>-100&&e.x<W+100);
 for(const o of obstacles){o.y+=scroll*dt;if(o.growing){o.growth=Math.min(1,o.growth+dt*1.75);if(o.growth>=1){o.growing=false;o.done=true;effects.push({type:'sparkle',x:o.x,y:o.y,t:0,life:.65,r:42})}}}obstacles=obstacles.filter(o=>o.y<H+70);
 // chick wandering
 chick.wander-=dt;if(chick.wander<=0&&!chick.stuck){chick.wander=.6+Math.random()*1.4;const a=Math.random()*Math.PI*2;chick.vx=Math.cos(a)*(20+Math.random()*32);chick.vy=Math.sin(a)*(12+Math.random()*24)}
 chick.bounce+=dt*(chick.jumpBoost>0?12:9);
 if(chick.stuck){chick.vx=chick.vy=0;const o=chick.stuck;if(o.done)chick.stuck=null;else if(o.type==='ledge'&&chick.jumpBoost>0)crossLedge(o)}
 else{chick.x+=chick.vx*dt;chick.y+=chick.vy*dt;chick.x=Math.max(16,Math.min(W-16,chick.x));chick.y=Math.max(H*.58,Math.min(H-18,chick.y))}
 for(const o of obstacles){if(o.done)continue;const near=chick.x>o.x-o.w/2&&chick.x<o.x+o.w/2&&Math.abs(chick.y-o.y)<Math.max(20,o.h*.42);if(near){if(o.type==='ledge'){if(chick.jumpBoost>0)crossLedge(o);else{chick.stuck=o;if(!o.hit){o.hit=true;addMinus(25,'段差で足止め')}}}else if(o.type==='sproutWater'){chick.stuck=o;if(!o.hit){o.hit=true;addMinus(45,'小川で足止め')}}else if(o.type==='leafPile'&&!o.hit){o.hit=true;addMinus(30,'葉っぱの山に接触')}}}
 // shots
 for(const s of shots){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.type==='waterUp'||s.type==='waterDown')s.height=Math.max(0,s.height-75*dt);if(s.type==='windDown')s.r+=35*dt;
   for(const e of enemies){if(e.dead)continue;const canAir=s.type!=='waterDown';if(e.air&&!canAir)continue;if(!e.flee&&Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r+((s.type==='windUp'||s.type==='windDown')?16:4)){e.flee=true;e.fleeT=0;addPlus(e.air?60:45,'敵を追い払った');effects.push({type:'surprise',x:e.x,y:e.y-24,t:0,life:.45,r:16});explodeShot(s,s.type.startsWith('water')?'water':'wind');s.t=s.life}}
   if(s.type==='windDown'&&!s.chickBoosted&&Math.hypot(s.x-chick.x,s.y-chick.y)<s.r+chick.r+22){s.chickBoosted=true;chick.jumpBoost=5.2;addPlus(20,'ヒヨコが大ジャンプ状態');effects.push({type:'sparkle',x:chick.x,y:chick.y-8,t:0,life:.5,r:28});explodeShot(s,'wind');s.t=s.life}
   for(const o of obstacles){
    const hit=Math.abs(s.x-o.x)<o.w/2+s.r&&Math.abs(s.y-o.y)<o.h/2+s.r;
    const growZone=o.type==='sproutWater'&&Math.abs(s.x-o.x)<o.w/2-8&&s.y>o.y+o.h/2-4&&s.y<o.y+o.h/2+56;
    if(s.type.startsWith('wind')&&o.type==='leafPile'&&!o.done&&hit){o.done=true;addPlus(35,'葉っぱの山を吹き払った');explodeShot(s,'wind');burst(o.x,o.y,'wind');s.t=s.life}
    if(s.type.startsWith('water')&&o.type==='sproutWater'&&!o.done&&!o.growing&&growZone){o.growing=true;o.growth=.02;addPlus(120,'草の橋を育てた');burst(s.x,o.y+o.h/2+18,'leaf');explodeShot(s,'water');s.t=s.life}
   }
 }
 for(const s of shots){if(!s.exploded&&(s.t>=s.life||s.y<=-75||s.y>=H+35))explodeShot(s,s.type.startsWith('water')?'water':'wind')}
 shots=shots.filter(s=>s.t<s.life&&s.y>-80&&s.y<H+40);
 for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}particles=particles.filter(p=>p.t<p.life);
 for(const e of effects)e.t+=dt;effects=effects.filter(e=>e.t<e.life);
 updateHud()}
function finish(){running=false;overlay.style.display='flex';intro.style.display='none';result.style.display='block';document.getElementById('rPlus').textContent=plus;document.getElementById('rMinus').textContent=minus}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(x,y,type){for(let i=0;i<16;i++){const a=i/16*Math.PI*2,sp=45+Math.random()*85;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.42+Math.random()*.28,type})}}
function explodeShot(s,type){if(s.exploded)return;s.exploded=true;effects.push({type,x:s.x,y:s.y,t:0,life:type==='water'?.42:.36,r:type==='water'?44:52});burst(s.x,s.y,type)}
function draw(){ctx.clearRect(0,0,W,H);drawGround();for(const o of obstacles)drawObstacle(o);for(const e of enemies)drawEnemy(e);for(const s of shots)drawShot(s);for(const e of effects)drawEffect(e);drawChick();drawFairy();for(const p of particles)drawParticle(p)}
function drawGround(){
  ctx.fillStyle='#659c4e';ctx.fillRect(0,0,W,H);
  const scroll=worldT*38,cell=64;
  function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
  for(let gy=Math.floor(scroll/cell)-1;gy<Math.floor((scroll+H)/cell)+2;gy++){
    const sy=gy*cell-scroll;
    for(let gx=0;gx<Math.ceil(W/cell)+1;gx++){
      const h=hash(gx,gy),x=gx*cell+h*28-8,y=sy+hash(gy,gx)*24;
      ctx.globalAlpha=.13;ctx.fillStyle=h>.5?'#b9d982':'#3d783a';ctx.beginPath();ctx.ellipse(x,y,30+h*18,18+h*12,h*2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.42;ctx.strokeStyle=h>.45?'#d3e89b':'#356e37';ctx.lineWidth=1.2;
      const blades=3+Math.floor(h*4);for(let i=0;i<blades;i++){const bx=x-12+i*6+hash(i+gx,gy)*4,by=y+10;ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx-3,by-7-h*4,bx-1,by-13-h*7);ctx.stroke();ctx.beginPath();ctx.moveTo(bx+1,by);ctx.quadraticCurveTo(bx+5,by-6,bx+4,by-11);ctx.stroke()}
      if(h>.78){ctx.globalAlpha=.65;ctx.fillStyle=h>.9?'#f6d66f':'#e9eef7';for(let i=0;i<3;i++){const a=i*Math.PI*2/3;ctx.beginPath();ctx.arc(x+Math.cos(a)*5,y-5+Math.sin(a)*4,2.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#d29b38';ctx.beginPath();ctx.arc(x,y-5,2,0,Math.PI*2);ctx.fill()}
      if(h<.12){ctx.globalAlpha=.25;ctx.fillStyle='#6d725b';ctx.beginPath();ctx.ellipse(x+18,y+6,5+h*12,3+h*6,.4,0,Math.PI*2);ctx.fill()}
    }
  }
  ctx.globalAlpha=1;
}
function wingPath(side,upper){
  ctx.beginPath();
  const sx=side, y0=upper?-5:8;
  ctx.moveTo(sx*5,y0);
  if(upper){ctx.bezierCurveTo(sx*16,-27,sx*39,-31,sx*43,-12);ctx.bezierCurveTo(sx*45,4,sx*24,8,sx*7,2)}
  else{ctx.bezierCurveTo(sx*15,5,sx*34,9,sx*34,24);ctx.bezierCurveTo(sx*30,37,sx*14,28,sx*5,13)}
  ctx.closePath();
}
function drawFairy(){

  ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawParticle(p){ctx.save();ctx.globalAlpha=1-p.t/p.life;ctx.translate(p.x,p.y);ctx.fillStyle=p.type==='water'?'#65cfff':p.type==='leaf'?'#67cf64':'#dfffe8';ctx.beginPath();ctx.arc(0,0,p.type==='leaf'?4:3,0,7);ctx.fill();ctx.restore()}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
draw();
</script>
</body>
