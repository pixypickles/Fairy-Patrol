<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#7fcf68" />
  <title>Fairy Guardian Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="stage">
      <canvas id="game" aria-label="妖精がヒヨコを守る縦長の見下ろし型シューティングゲーム"></canvas>
      <section id="hud">
        <div class="pill scorePlus">＋ <span id="plusScore">0</span>点</div>
        <div class="pill scoreMinus">－ <span id="minusScore">0</span>点</div>
        <div class="pill">あと <span id="distance">100</span>m</div>
      </section>
      
    </section>

    <section id="controlDock" aria-label="操作パネル">
      <section id="dpad" aria-label="8方向アナログスティック">
        <div class="stickGuide" aria-hidden="true">
          <span class="guide up">▲</span><span class="guide upRight">↗</span>
          <span class="guide right">▶</span><span class="guide downRight">↘</span>
          <span class="guide down">▼</span><span class="guide downLeft">↙</span>
          <span class="guide left">◀</span><span class="guide upLeft">↖</span>
        </div>
        <div id="stickKnob" aria-hidden="true"></div>
      </section>
      <section id="buttons" aria-label="魔法ボタン">
        <button class="magic wind windUp" data-action="windForward"><b>風・上</b><small>前方エアーブラスト</small></button>
        <button class="magic wind windDown" data-action="windDown"><b>風・下</b><small>下方エアーブラスト</small></button>
        <button class="magic water waterUp" data-action="waterForward"><b>水・上</b><small>前方ウォーターボール</small></button>
        <button class="magic water waterDown" data-action="waterDown"><b>水・下</b><small>下方ウォーターボール</small></button>
      </section>
    </section>

    <section id="overlay" class="show">
      <div class="card">
        <h1>Fairy Guardian</h1>
        <p>円形スティックで妖精を動かし、気まぐれに歩く1匹のヒヨコを守ろう。成功点とミス点は別々に記録され、マイナスが増えてもゲームは続きます。</p>
        <dl>
          <div><dt>風↑</dt><dd>円形の風玉を前方へ発射。鳥の近く、または地面への着弾で破裂する</dd></div>
          <div><dt>風↓</dt><dd>近い地面へ素早く落とす短射程の風玉。段差で跳べないヒヨコを飛び越えさせる</dd></div>
          <div><dt>水↑</dt><dd>水の塊を前方へ発射し、飛びながら落下。鳥にも当たり、水辺の双葉も育てる</dd></div>
          <div><dt>水↓</dt><dd>水の塊を真下へ短く落とし、1秒未満で破裂する</dd></div>
        </dl>
        <button id="startBtn">スタート</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
