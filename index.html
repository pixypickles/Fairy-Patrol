<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#bdefff" />
  <title>Fairy Guardian Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="妖精がヒヨコを守る縦スクロールゲーム"></canvas>

    <section id="hud">
      <div class="pill">🐥 <span id="chickHp">3</span></div>
      <div class="pill">あと <span id="distance">100</span>m</div>
      <div class="pill shield">🛡️ <span id="shieldGauge">100</span>%</div>
    </section>

    <div id="moveHint">左側を指でなぞって移動</div>

    <section id="buttons" aria-label="魔法ボタン">
      <button class="magic wind" data-action="cutter"><b>A</b><small>カッター</small></button>
      <button class="magic blast" data-action="blast"><b>B</b><small>ブラスト</small></button>
      <button class="magic water" data-action="water"><b>C</b><small>水ボム</small></button>
      <button class="magic shieldBtn" data-action="shield"><b>D</b><small>シールド</small></button>
    </section>

    <section id="overlay" class="show">
      <div class="card">
        <h1>Fairy Guardian</h1>
        <p>妖精を動かして、歩くヒヨコを安全に送り届けよう。</p>
        <dl>
          <div><dt>A</dt><dd>前方へウィンドカッター</dd></div>
          <div><dt>B</dt><dd>斜め下へエアーブラスト。敵や小枝を吹き飛ばす</dd></div>
          <div><dt>C</dt><dd>真下へウォーターボム。植物を成長させる</dd></div>
          <div><dt>D</dt><dd>ヒヨコを短時間シールド</dd></div>
        </dl>
        <button id="startBtn">スタート</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
